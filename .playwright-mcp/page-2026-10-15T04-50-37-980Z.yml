              - heading "Why the current service is used" [level=3] [ref=f3e105]
              - 'heading "Adopt a shadow-traffic dual-write migration strategy `dec-2026-01-dual-write-migration`" [level=4] [ref=f3e107]'
              - paragraph [ref=f3e108]: "*Status proposed on 2026-01-22.* A big-bang cutover carries unacceptable risk for 4.2M monthly payment calls. We will shadow real traffic to Payment Service B, compare authorisation results, and only then shift the primary write path. Cutover requires sign-off from the owners of every service that depends on the payment path."
              - 'heading "Modernise the payment stack and evaluate PayFlow as a replacement `dec-2025-08-payments-modernization`" [level=4] [ref=f3e110]'
              - paragraph [ref=f3e111]: "*Status accepted on 2025-08-05.* LegacyPay has announced an API v3 sunset in Q4 2026, which forces a migration regardless of preference. PayFlow offers lower per-transaction cost, native multi-currency, and 3DS step-up authentication that LegacyPay only supports through a third-party add-on. We committed to building Payment Service B against PayFlow before the sunset deadline."
              - 'heading "Route all payment fraud scoring through a single gateway `dec-2025-05-unified-fraud-gateway`" [level=4] [ref=f3e113]'
              - paragraph [ref=f3e114]: "*Status accepted on 2025-05-08.* Checkout and the legacy payment integration were calling the fraud model directly with divergent rules. Consolidating behind one gateway removed inconsistent decline behaviour and gave a single place to enforce latency budgets."
              - 'heading "Route all payment fraud scoring through a single gateway `dec-2025-05-unified-fraud-gateway`" [level=4] [ref=f3e116]'
              - paragraph [ref=f3e117]: "*Status accepted on 2025-05-08.* Checkout and the legacy payment integration were calling the fraud model directly with divergent rules. Consolidating behind one gateway removed inconsistent decline behaviour and gave a single place to enforce latency budgets."
              - 'heading "Retain 15-minute batch ledger sync instead of real-time events `dec-2024-02-retain-batch-ledger-sync`" [level=4] [ref=f3e119]'
              - paragraph [ref=f3e120]: "*Status accepted on 2024-02-19.* Finance requires a reconciled general ledger before period close. Batch sync met this requirement with a known worst-case drift of 15 minutes, which was accepted as an explicit trade-off against the operational cost of real-time streaming."
              - 'heading "Adopt LegacyPay as the primary payment processor `dec-2023-06-legacypay-adoption`" [level=4] [ref=f3e122]'
              - paragraph [ref=f3e123]: "*Status superseded on 2023-06-14.* LegacyPay offered the fastest integration path and kept us inside PCI SAQ-A scope, avoiding cardholder data on our own infrastructure. At the time it was the only processor meeting our three-day launch requirement. No analysis of processor portability was performed."
              - paragraph [ref=f3e124]:
                - strong [ref=f3e125]: "Superseded by:"
                - text: Modernise the payment stack and evaluate PayFlow as a replacement
